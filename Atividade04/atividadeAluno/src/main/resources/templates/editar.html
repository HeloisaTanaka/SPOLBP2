<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Alunos</title>
    <!-- Bootstrap para deixar a página com visual de sistema -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Editar Aluno</h2>

    <!-- Formulário de Edição -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/editar}" th:object="${aluno}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}" /> <!-- Como eu passei o objeto aluno para editar.html por meio da rota /editar/{id}, eu consigo deixar os campos pré-preenchidos -->
                <div class="col-md-5">
                    <label for="nome" class="form-label">Nome do Aluno</label>
                    <input type="text" id="nome" th:field="*{nome}" class="form-control">
                </div>
                <div class="col-md-5">
                    <label for="prontuario" class="form-label">Prontuário</label>
                    <input type="text" id="prontuario" th:field="*{prontuario}" class="form-control">
                </div>
                <div class="col-md-5">
                    <label for="curso" class="form-label">Curso</label>
                    <input type="text" id="curso" th:field="*{curso}" class="form-control">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Salvar</button>
                </div>
            </form>
        </div>
    </div>

</div>

</body>
</html>
